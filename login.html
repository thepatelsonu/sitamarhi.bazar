<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b45">
  <title>Merchant Login | Sitamarhi Bazar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
  <div class="container nav-wrap">
    <a class="brand" href="index.html"><img src="assets/sitamarhi-bazar-logo.png" alt="Sitamarhi Bazar logo"><span><strong>Sitamarhi Bazar</strong><small>Sitamarhi Ki Har Dukaan, Ek Hi Jagah.</small></span></a>
    <nav><a href="index.html#discover">Explore Shops</a><a class="nav-cta" href="index.html#list-business">List Your Business</a></nav>
  </div>
</header>
<main class="merchant-section">
  <div class="container" style="max-width:520px">
    <form class="listing-form" id="loginForm">
      <h3>Merchant login</h3>
      <p>Sign in to view your Sitamarhi Bazar business registration.</p>
      <label>Email address<input name="email" type="email" autocomplete="email" required placeholder="you@example.com"></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required minlength="8" placeholder="Your password"></label>
      <button class="submit-btn" type="submit">Sign in</button>
      <p id="authMessage" role="status" aria-live="polite"></p>
      <small>New to Sitamarhi Bazar? <a class="text-link" href="index.html#list-business">Register your business</a>.</small>
    </form>
  </div>
</main>
<script type="module" src="auth.js"></script>
</body>
</html>
